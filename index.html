<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мужская стрижка и бритье | Барбершоп "BORODA"</title>
    <style>
        /* --- Сброс базовых стилей и шрифты --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #121513;        /* Основной почти черный фон */
            --card-bg: #1a201c;        /* Цвет карточек и блоков */
            --accent-green: #2e5a44;   /* Темно-зеленый основной цвет */
            --bright-green: #3f7a5c;   /* Светло-зеленый акцент */
            --text-light: #e5ece8;     /* Светлый цвет текста */
            --text-muted: #9eb1a6;     /* Приглушенный цвет текста */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* --- Шапка --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(18, 21, 19, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(46, 90, 68, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-light);
        }

        .header nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .header nav a:hover {
            color: var(--bright-green);
        }

        /* --- Главный экран --- */
        .hero {
            padding: 100px 5% 80px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--card-bg) 100%);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* --- Кнопки --- */
        .btn {
            display: inline-block;
            background-color: var(--accent-green);
            color: var(--text-light);
            padding: 14px 28px;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: var(--bright-green);
            transform: translateY(-2px);
        }

        /* --- Блок услуг --- */
        .services {
            padding: 60px 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .services h2, .booking h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .services ul {
            list-style: none;
        }

        .services li {
            display: flex;
            justify-content: space-between;
            padding: 18px 20px;
            margin-bottom: 12px;
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-green);
            border-radius: 4px;
            font-size: 18px;
        }

        /* --- Форма записи --- */
        .booking {
            padding: 60px 5%;
            max-width: 500px;
            margin: 0 auto;
        }

        .booking form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(46, 90, 68, 0.2);
        }

        .booking input, .booking select {
            padding: 12px 15px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(46, 90, 68, 0.5);
            border-radius: 4px;
            color: var(--text-light);
            font-size: 16px;
        }

        .booking input:focus, .booking select:focus {
            outline: none;
            border-color: var(--bright-green);
        }

        #status {
            margin-top: 15px;
            text-align: center;
            color: var(--bright-green);
            font-weight: 600;
        }

        /* --- Мобильная адаптивность --- */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 28px;
            }
            .header {
                flex-direction: column;
                gap: 10px;
            }
            .header nav a {
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="header">
        <div class="logo">BORODA</div>
        <nav>
            <a href="#services">Услуги</a>
            <a href="#booking">Запись</a>
        </nav>
    </header>

    <!-- Первый экран -->
    <section class="hero">
        <h1>Стильные мужские стрижки и бритье</h1>
        <p>Премиальный сервис и мужская атмосфера в центре города.</p>
        <a href="#booking" class="btn">Записаться онлайн</a>
    </section>

    <!-- Прайс-лист -->
    <section id="services" class="services">
        <h2>Услуги и цены</h2>
        <ul>
            <li><span>Мужская стрижка</span> <span>1 500 ₽</span></li>
            <li><span>Оформление бороды</span> <span>1 000 ₽</span></li>
            <li><span>Комплекс (Стрижка + Борода)</span> <span>2 200 ₽</span></li>
            <li><span>Детская стрижка</span> <span>1 200 ₽</span></li>
        </ul>
    </section>

    <!-- Форма записи -->
    <section id="booking" class="booking">
        <h2>Онлайн-запись</h2>
        <form id="tg-form">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Ваш телефон" required>
            <select id="service">
                <option value="Мужская стрижка">Мужская стрижка</option>
                <option value="Оформление бороды">Оформление бороды</option>
                <option value="Комплекс">Комплекс (Стрижка + Борода)</option>
            </select>
            <button type="submit" class="btn">Отправить заявку</button>
        </form>
        <div id="status"></div>
    </section>

    <!-- Скрипт отправки в Telegram -->
    <script>
        // Замените эти значения на данные вашего Telegram-бота
        const BOT_TOKEN = 'ВАШ_ТОКЕН_БОТА';
        const CHAT_ID = 'ВАШ_CHAT_ID';

        document.getElementById('tg-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const service = document.getElementById('service').value;
            const statusDiv = document.getElementById('status');

            const message = `<b>🔥 Новая заявка с сайта!</b>\n\n` +
                            `<b>Имя:</b> ${name}\n` +
                            `<b>Телефон:</b> ${phone}\n` +
                            `<b>Услуга:</b> ${service}`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    parse_mode: 'html',
                    text: message
                })
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.innerText = 'Заявка успешно отправлена!';
                    document.getElementById('tg-form').reset();
                } else {
                    statusDiv.innerText = 'Ошибка отправки. Проверьте настройки бота.';
                }
            })
            .catch(() => {
                statusDiv.innerText = 'Ошибка соединения.';
            });
        });
    </script>
</body>
</html>
